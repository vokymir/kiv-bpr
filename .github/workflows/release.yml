name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't kill Linux if Windows fails (helpful for debugging)
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: ssoc-linux.tar.gz
          - os: windows-latest
            asset_name: ssoc-windows.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # <--- FIX: This allows igraph to find the version tags

    - name: Install System Deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev xorg-dev \
                                libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

    - name: Setup SDL3
      id: sdl
      uses: libsdl-org/setup-sdl@v1
      with:
        version: 3-latest
        install-linux-dependencies: true

    - name: Configure CMake
      # Using Ninja on Linux is much faster for cloud builds
      run: cmake -B build -G "${{ runner.os == 'Linux' && 'Ninja' || 'Visual Studio 17 2022' }}" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        # In your CMake, RUNTIME_OUTPUT_DIRECTORY is set to "${CMAKE_CURRENT_SOURCE_DIR}/bin"
        tar -czvf ${{ matrix.asset_name }} -C bin ssoc

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p dist
        # Copy the exe (it should be in bin/Release/ because of MSVC)
        cp bin/Release/ssoc.exe dist/
        # Copy the DLL from the SDL setup path
        cp "${{ steps.sdl.outputs.prefix }}/bin/SDL3.dll" dist/
        cd dist
        7z a ../${{ matrix.asset_name }} *

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.asset_name }}
        draft: true
