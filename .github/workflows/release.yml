name: Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: ssoc-linux.tar.gz
            triplet: x64-linux
          - os: windows-latest
            asset_name: ssoc-windows.zip
            triplet: x64-windows

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # Important for igraph versioning

    # --- Setup Linux Dependencies ---
    - name: Install Linux Build Tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-14 g++-14 gfortran-14 libstdc++-14-dev \
          cmake ninja-build pkg-config \
          autoconf autoconf-archive automake libtool libltdl-dev \
          libgl1-mesa-dev xorg-dev libasound2-dev libpulse-dev

    # --- Setup vcpkg ---
    # GitHub Runners have vcpkg pre-installed at $VCPKG_INSTALLATION_ROOT
    - name: Restore vcpkg Cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/build/vcpkg_installed
          ~/.cache/vcpkg
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

    # --- Build ---
    - name: Configure and Build
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          export CC=gcc-14
          export CXX=g++-14
          export FC=gfortran-14

          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        else
          # On Windows, we use the Visual Studio Generator to ensure MSVC is used
          # This avoids the MinGW/ld.exe errors entirely
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        fi

        cmake --build build --config Release

    # --- Packaging ---
    - name: Package Binaries
      shell: bash
      run: |
        mkdir -p dist
        if [ "${{ runner.os }}" == "Windows" ]; then
          # Copy exe from your custom bin dir
          cp bin/ssoc.exe dist/
          # Copy SDL3.dll and other dependencies from vcpkg install folder
          cp build/vcpkg_installed/${{ matrix.triplet }}/bin/*.dll dist/ || true
          cd dist && 7z a ../${{ matrix.asset_name }} *
        else
          # Linux packaging
          cp bin/ssoc dist/
          tar -czvf ${{ matrix.asset_name }} -C dist ssoc
        fi

    # --- Create/Update Release ---
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.asset_name }}
        draft: true
        generate_release_notes: true
