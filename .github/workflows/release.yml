name: Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: ssoc-linux.tar.gz
            triplet: x64-linux
          - os: windows-latest
            asset_name: ssoc-windows.zip
            triplet: x64-windows

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # Important for igraph versioning

    # --- Setup Linux Dependencies ---
    - name: Install Linux Build Tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-14 g++-14 gfortran-14 libstdc++-14-dev \
          cmake ninja-build pkg-config \
          autoconf autoconf-archive automake libtool libltdl-dev \
          libgl1-mesa-dev xorg-dev libasound2-dev libpulse-dev

    # --- Setup vcpkg ---
    # GitHub Runners have vcpkg pre-installed at $VCPKG_INSTALLATION_ROOT
    - name: Restore vcpkg Cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/build/vcpkg_installed
          ~/.cache/vcpkg
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

    # Ensure vcpkg has full history so builtin-baseline can be checked out
    - name: Ensure vcpkg git history (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "VCPKG_INSTALLATION_ROOT=$VCPKG_INSTALLATION_ROOT"
        if [ -d "${VCPKG_INSTALLATION_ROOT}/.git" ]; then
          # fetch everything and tags, try to unshallow if this is a shallow clone
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --all --tags || true
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --unshallow || true
        else
          echo "No $VCPKG_INSTALLATION_ROOT/.git found; skipping fetch"
        fi

    - name: Ensure vcpkg git history (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
        if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\.git") {
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --all --tags -f || Write-Host "git fetch failed but continuing"
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --unshallow -f || Write-Host "'fetch --unshallow' failed but continuing"
        } else {
          Write-Host "No $env:VCPKG_INSTALLATION_ROOT\\.git found; skipping fetch"
        }

    - name: Sanity, ensure ninja exists (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ninja-build
        fi
        ninja --version || true

    # --- Build ---
    - name: Configure and Build
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          export CC=gcc-14 CXX=g++-14 FC=gfortran-14

          # We inject the static flags ONLY here.
          # -static-libstdc++: Includes the C++ runner in the file.
          # -static-libgcc: Includes the C runner.
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
        else
          # On Windows, we use x64-windows-static for vcpkg
          # AND we inject CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded (the /MT flag)
          # This forces MSVC to bake the runtime into the .exe
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"
        fi

        cmake --build build --config Release

    # --- Packaging ---
    - name: Package Binaries
      shell: bash
      run: |
        mkdir -p dist
        if [ "${{ runner.os }}" == "Windows" ]; then
          # Grab the standalone exe
          find bin -name "ssoc.exe" -exec cp {} dist/ssoc-windows.exe \;
        else
          # Grab the standalone linux binary
          cp bin/ssoc dist/ssoc-linux
        fi

    # --- Create/Update Release ---
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ssoc-windows.exe
          dist/ssoc-linux
        draft: true

