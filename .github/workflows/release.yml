name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v0.0.1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04 # Using 24.04 to ensure GCC is new enough for C++23
            asset_name: ssoc-linux.tar.gz
            binary_path: bin/ssoc
          - os: windows-latest
            asset_name: ssoc-windows.zip
            binary_path: bin/Release/ssoc.exe # MSVC appends Release/ by default

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Essential for your external/imgui and external/igraph

    # --- dependency setup ---

    - name: Install System Deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev xorg-dev

    # This magic step installs SDL3 so find_package(SDL3) works on both Windows and Linux
    - name: Setup SDL3
      id: sdl
      uses: libsdl-org/setup-sdl@v1
      with:
        version: 3-latest
        install-linux-dependencies: true
        
    # --- Build ---

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    # --- Packaging ---

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        # Compress the binary found in your custom output dir
        tar -czvf ${{ matrix.asset_name }} -C bin ssoc

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # 1. Create a staging folder
        mkdir -p package
        
        # 2. Copy the game executable (CMake puts it in bin/Release on Windows)
        cp ${{ matrix.binary_path }} package/
        
        # 3. CRITICAL: Copy SDL3.dll so the game runs!
        # The 'setup-sdl' action sets an env var for where it installed the libs
        cp "${{ steps.sdl.outputs.prefix }}/bin/SDL3.dll" package/ || echo "Warning: SDL3.dll not found automatically"
        
        # 4. Zip it up
        cd package
        7z a ../${{ matrix.asset_name }} *

    # --- Release ---

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ matrix.asset_name }}
        draft: true
